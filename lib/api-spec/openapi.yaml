openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: askdata
    description: Natural-language data exploration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schema:
    get:
      operationId: getSchema
      tags: [askdata]
      summary: Get the sample database schema
      responses:
        "200":
          description: Database schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSchema"
  /ask:
    post:
      operationId: askData
      tags: [askdata]
      summary: Turn a natural-language question into a safe query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskDataInput"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskDataResult"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskDataResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AskDataInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - question
    QueryError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    AskDataResult:
      type: object
      properties:
        question:
          type: string
        sql:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        row_count:
          type: integer
        cached:
          type: boolean
        error:
          oneOf:
            - $ref: "#/components/schemas/QueryError"
            - type: "null"
      required:
        - question
        - sql
        - columns
        - rows
        - row_count
        - cached
        - error
    SchemaColumn:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
        description:
          type: string
      required:
        - name
        - type
        - nullable
        - description
    SchemaTable:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SchemaColumn"
      required:
        - name
        - description
        - columns
    SchemaRelationship:
      type: object
      properties:
        from_table:
          type: string
        from_column:
          type: string
        to_table:
          type: string
        to_column:
          type: string
      required:
        - from_table
        - from_column
        - to_table
        - to_column
    DatabaseSchema:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SchemaTable"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/SchemaRelationship"
        row_count:
          type: integer
      required:
        - tables
        - relationships
        - row_count

